services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dar_local}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dar_local_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-dar_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-dar_minio_access}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-dar_minio_secret_change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-56Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/$${S3_BUCKET_ORIGINALS:-dar-originals} || true;
      mc mb -p local/$${S3_BUCKET_DERIVED:-dar-derived} || true;
      mc mb -p local/$${S3_BUCKET_REPORTS:-dar-reports} || true;
      mc mb -p local/$${S3_BUCKET_QUARANTINE:-dar-quarantine} || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-dar_minio_access}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-dar_minio_secret_change_me}
      S3_BUCKET_ORIGINALS: ${S3_BUCKET_ORIGINALS:-dar-originals}
      S3_BUCKET_DERIVED: ${S3_BUCKET_DERIVED:-dar-derived}
      S3_BUCKET_REPORTS: ${S3_BUCKET_REPORTS:-dar-reports}
      S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE:-dar-quarantine}

  clamav:
    image: clamav/clamav:1.4
    ports:
      - "3310:3310"
    volumes:
      - ./.data/clamav:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc 127.0.0.1 3310 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  api:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dar_local}:${POSTGRES_PASSWORD:-dar_local_password_change_me}@postgres:5432/${POSTGRES_DB:-dar_local}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      CLAMAV_HOST: clamav
      APP_ENV: local
      ALLOW_FAKE_PROVIDERS: "true"
      OBJECT_STORAGE_PROVIDER: s3
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    profiles: ["apps"]
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dar_local}:${POSTGRES_PASSWORD:-dar_local_password_change_me}@postgres:5432/${POSTGRES_DB:-dar_local}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      APP_ENV: local
      ALLOW_FAKE_PROVIDERS: "true"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
