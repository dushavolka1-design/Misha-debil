# Staging (synthetic data only)

# Reuses local infra images but isolates project name / volumes.
# Do NOT point at production secrets.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dar_staging
      POSTGRES_PASSWORD: dar_staging_synthetic_only
      POSTGRES_DB: dar_staging
    ports:
      - "5433:5432"
    volumes:
      - ./.data/staging-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dar_staging_access
      MINIO_ROOT_PASSWORD: dar_staging_secret_synthetic
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - ./.data/staging-minio:/data

  clamav:
    image: clamav/clamav:1.4
    ports:
      - "3311:3310"
    profiles: ["av"]

# Application processes are started by operators with APP_ENV=staging and
# ALLOW_FAKE_PROVIDERS=true until live providers are approved.
# Seed: infra/staging/synthetic_seed.md
