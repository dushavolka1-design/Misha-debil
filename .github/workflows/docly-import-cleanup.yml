name: Docly reviewed import cleanup
on:
  push:
    branches: [fix/docly-desktop-upgrade-safety]
    paths: ['scripts/reviewed_import_cleanup.py', '.github/workflows/docly-import-cleanup.yml']
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: docly-reviewed-import-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/fix/docly-desktop-upgrade-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: apps/api:apps/worker
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e packages/py_dar -r apps/api/requirements.txt -e 'apps/api[dev]'
      - name: Baseline safety regressions before changing imports
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/import-cleanup
          python -m pytest apps/api/tests/test_desktop*.py apps/api/tests/test_csrf_referer_origin.py -q --junitxml=artifacts/import-cleanup/before.xml 2>&1 | tee artifacts/import-cleanup/before.log
      - name: Apply safe fixes and verify unchanged non-import syntax
        run: python scripts/reviewed_import_cleanup.py
      - name: Repeat the same safety regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest apps/api/tests/test_desktop*.py apps/api/tests/test_csrf_referer_origin.py -q --junitxml=artifacts/import-cleanup/after.xml 2>&1 | tee artifacts/import-cleanup/after.log
          python -m unittest discover -s scripts/windows -p test_launcher_safety.py -v
      - name: Commit only verified import changes without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          def cases(name):
              root = ET.parse(f'artifacts/import-cleanup/{name}.xml').getroot()
              rows = root.findall('.//testcase')
              assert rows and all(len(r) == 0 for r in rows), 'Failed, skipped or unexpected test outcome'
              return sorted((r.get('classname'), r.get('name')) for r in rows)
          assert cases('before') == cases('after'), 'Test coverage changed'
          files = json.loads(Path('artifacts/import-cleanup/changed-files.json').read_text())
          if files:
              subprocess.run(['git', 'add', '--', *files], check=True)
          PY
          git diff --cached --check
          git diff --cached > artifacts/import-cleanup/reviewed.patch
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(python): remove unused imports after AST and regression verification'
            git push origin HEAD:fix/docly-desktop-upgrade-safety
          fi
          git rev-parse HEAD > artifacts/import-cleanup/commit.txt
      - name: All remaining lint findings stay blocking
        run: python -m ruff check apps/api/app apps/api/tests packages/py_dar/src apps/worker/worker --output-format json > artifacts/import-cleanup/remaining-ruff.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: evidence
        if: always()
        with:
          name: reviewed-import-cleanup
          path: artifacts/import-cleanup/
          if-no-files-found: error
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        if: always()
        env:
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const fs = require('fs');
            const dir = 'artifacts/import-cleanup/';
            const read = name => fs.existsSync(dir + name) ? fs.readFileSync(dir + name, 'utf8') : 'not produced';
            let findings = read('remaining-ruff.json');
            if (findings !== 'not produced') findings = JSON.parse(findings).map(f => `${f.filename.replace(process.env.GITHUB_WORKSPACE + '/', '')}:${f.location.row} ${f.code} ${f.message}`).join('\n');
            await github.rest.issues.createComment({...context.repo, issue_number: 1, body: `## Reviewed import cleanup: ${process.env.JOB_STATUS}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nEvidence: ${process.env.EVIDENCE_URL || 'unavailable'}\nResulting commit: ${read('commit.txt')}\n\nRemaining mandatory lint findings:\n\n\`\`\`text\n${findings}\n\`\`\`\n\nOnly import changes were authorized. Before/after regressions and reviewed patch are in the artifact. This does not certify full CI, installer, migrations, or forms. Bot commits require a fresh verification run.`});
