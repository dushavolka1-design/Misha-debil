name: Docly SQLite queue claim regressions

on:
  push:
    branches: [fix/docly-desktop-upgrade-safety]
    paths:
      - 'apps/api/app/models.py'
      - 'apps/api/app/services/jobs/**'
      - 'apps/api/tests/test_job_broker_claim.py'
      - '.github/workflows/docly-queue-regressions.yml'
  pull_request:
    paths:
      - 'apps/api/app/models.py'
      - 'apps/api/app/services/jobs/**'
      - 'apps/api/tests/test_job_broker_claim.py'
      - '.github/workflows/docly-queue-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claim:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated queue test dependency
        run: python -m pip install 'SQLAlchemy>=2.0,<2.1'
      - name: Test real SQLite concurrent claims and invalid payloads
        shell: bash
        env:
          PYTHONPATH: apps/api
        run: |
          set -euo pipefail
          mkdir -p artifacts/queue-claims
          python -m pip freeze > artifacts/queue-claims/dependencies.txt
          python -m unittest discover -s apps/api/tests -p test_job_broker_claim.py -v 2>&1 | tee artifacts/queue-claims/tests.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sqlite-queue-claims-${{ matrix.os }}
          path: artifacts/queue-claims/
          if-no-files-found: error
