name: Docly reviewed test fixture repair
on:
  push:
    branches: [fix/docly-desktop-upgrade-safety]
    paths:
      - scripts/repair_runtime_fixture_alignment.py
      - .github/workflows/docly-test-contract-repair.yml
permissions:
  contents: read
jobs:
  repair:
    if: github.repository == 'dushavolka1-design/Misha-debil' && github.ref == 'refs/heads/fix/docly-desktop-upgrade-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exact reviewed replacements only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/repair_runtime_fixture_alignment.py
          python -m pip install ruff==0.15.0
          python -m ruff check --select I --fix apps/api/tests/test_forms_medical.py apps/api/tests/test_upload_lifecycle.py
          python -m compileall -q apps/api/tests
          git diff --check
          git diff --stat
      - name: Publish non-rewriting commit and request real checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin fix/docly-desktop-upgrade-safety
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/tests/test_forms_medical.py apps/api/tests/test_upload_lifecycle.py
          git commit -m 'test(api): preserve consumer-owned services and await actual upload readiness'
          git push origin HEAD:refs/heads/fix/docly-desktop-upgrade-safety
          gh workflow run docly-python-runtime.yml --ref fix/docly-desktop-upgrade-safety
          gh workflow run docly-quality-evidence.yml --ref fix/docly-desktop-upgrade-safety
          gh pr comment 1 --body "Applied reviewed source-host and asynchronous-upload fixture corrections at $(git rev-parse HEAD). The consumer and HTTP handlers now use the same real lifespan-owned service; the test requires eventual READY and successful owner download before checking IDOR. Runtime and quality checks dispatched. This repair job is NOT acceptance; original CI and installer checks remain required."
