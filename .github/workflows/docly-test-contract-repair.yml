name: Docly reviewed desktop test contract repair
on:
  push:
    branches: [fix/docly-desktop-upgrade-safety]
    paths:
      - scripts/repair_desktop_auth_test_contracts.py
      - .github/workflows/docly-test-contract-repair.yml
permissions:
  contents: read
jobs:
  repair:
    if: github.repository == 'dushavolka1-design/Misha-debil' && github.ref == 'refs/heads/fix/docly-desktop-upgrade-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply exact reviewed replacements only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/repair_desktop_auth_test_contracts.py
          python -m pip install ruff==0.15.0
          python -m ruff check --select I --fix apps/api/tests/test_auth_consent.py apps/api/tests/test_form_catalog_api_contract.py apps/api/tests/test_prompt6_acceptance.py apps/api/tests/test_worksheets_official_acts.py
          python -m compileall -q apps/api/tests
          git diff --check
          git diff --stat
      - name: Publish non-rewriting commit and request real checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin fix/docly-desktop-upgrade-safety
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/tests/test_auth_consent.py apps/api/tests/test_form_catalog_api_contract.py apps/api/tests/test_prompt6_acceptance.py apps/api/tests/test_worksheets_official_acts.py
          git commit -m 'test(auth): assert desktop activation and reject consumed-token replay'
          git push origin HEAD:refs/heads/fix/docly-desktop-upgrade-safety
          gh workflow run docly-python-runtime.yml --ref fix/docly-desktop-upgrade-safety
          gh workflow run docly-quality-evidence.yml --ref fix/docly-desktop-upgrade-safety
          gh pr comment 1 --body "Applied reviewed desktop-only test corrections at $(git rev-parse HEAD). Assertions now require existing user activation and consumed-token rejection; production and manual-verification regressions remain unchanged. Runtime and strict quality checks dispatched. Original CI, installer and release acceptance are still required; this repair job is NOT acceptance."
