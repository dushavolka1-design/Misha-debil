name: Docly API contract regressions
on:
  push:
    branches: [fix/docly-desktop-upgrade-safety]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install real application test dependencies
        run: python -m pip install -e packages/py_dar -r apps/api/requirements.txt -e 'apps/api[dev]'
      - name: Authentication and maintenance authorization contracts
        run: |
          set -euo pipefail
          mkdir -p artifacts/api-contracts
          python -m pytest -q -ra apps/api/tests/test_auth_route_regressions.py apps/api/tests/test_document_maintenance_authorization.py --junitxml=artifacts/api-contracts/contracts.xml 2>&1 | tee artifacts/api-contracts/contracts.log
      - name: Verify PEP 561 marker in the actual API wheel
        run: |
          set -euo pipefail
          mkdir -p artifacts/api-contracts/wheels
          python -m pip wheel --no-deps apps/api --wheel-dir artifacts/api-contracts/wheels 2>&1 | tee artifacts/api-contracts/wheel.log
          python - <<'PY' | tee artifacts/api-contracts/typed-package.log
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path('artifacts/api-contracts/wheels').glob('dar_api-*.whl'))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              assert 'app/py.typed' in wheel.namelist()
              assert 'app/services/jobs/worker_runtime.py' in wheel.namelist()
          print('PASS: built API wheel contains PEP 561 marker and worker runtime')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        id: evidence
        with:
          name: api-contract-evidence
          path: artifacts/api-contracts/
          if-no-files-found: error
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const parts = ['contracts', 'typed-package', 'wheel'].map(name => {
              const path = `artifacts/api-contracts/${name}.log`;
              return `### ${name}\n\`\`\`text\n${fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(-7000) : 'NOT RUN'}\n\`\`\``;
            });
            await github.rest.issues.createComment({...context.repo, issue_number: 1, body: `## API contract evidence: ${process.env.JOB_STATUS}\nCommit: ${context.sha}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nArtifact: ${process.env.EVIDENCE_URL || 'unavailable'}\n${parts.join('\n')}\nScope: real auth routes; maintenance route authorization with service spies; built wheel marker. Not full integration or installer acceptance. One-shot repair write permissions have been removed.`});
