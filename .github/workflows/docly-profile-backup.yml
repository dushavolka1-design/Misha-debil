name: Docly full-profile backup regressions
on:
  push:
    branches: [fix/docly-desktop-upgrade-safety]
    paths: ['apps/api/app/profile_backup.py', 'apps/api/tests/test_desktop_profile_backup.py', '.github/workflows/docly-profile-backup.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-backup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONPATH: apps/api
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Real filesystem and SQLite tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s apps/api/tests -p test_desktop_profile_backup.py -v 2>&1 | tee profile-backup.log
      - name: Lint new backup source and tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff
          python -m ruff check apps/api/app/profile_backup.py apps/api/tests/test_desktop_profile_backup.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: profile-backup-${{ matrix.os }}
          path: profile-backup.log
          if-no-files-found: error
  report:
    needs: profile-backup
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          RESULT: ${{ needs.profile-backup.result }}
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {...context.repo, run_id: context.runId});
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id: context.runId});
            const statuses = jobs.map(j => `${j.name}: ${j.status}/${j.conclusion || 'pending'}; ${j.html_url}`).join('\n');
            const files = artifacts.map(a => `${a.name}: ${run}/artifacts/${a.id}`).join('\n');
            await github.rest.issues.createComment({...context.repo, issue_number: 1, body: `## Whole-profile backup module: ${process.env.RESULT}\nCommit: ${context.sha}\nRun: ${run}\n${statuses}\n${files}\n\nScope: real filesystem/SQLite tests, including committed WAL and failure-before-publication. Not yet wired into Inno Setup; no automatic rollback or installer acceptance claimed.`});
