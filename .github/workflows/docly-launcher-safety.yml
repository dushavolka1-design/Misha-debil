name: Docly launcher safety regressions

on:
  push:
    branches: [fix/docly-desktop-upgrade-safety]
    paths:
      - 'scripts/windows/**'
      - '.github/workflows/docly-launcher-safety.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run dependency-free regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts/windows -p test_launcher_safety.py -v 2>&1 | tee launcher-safety.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: launcher-safety-linux
          path: launcher-safety.log
          if-no-files-found: error

  windows-kernel-regressions:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Portable regressions on Windows
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/windows -p test_launcher_safety.py -v *> launcher-safety.log
          $code = $LASTEXITCODE
          Get-Content launcher-safety.log
          if ($code -ne 0) { exit $code }
      - name: Real kernel identity and termination
        shell: pwsh
        run: |
          python scripts/windows/test_launcher_windows.py -v *> launcher-kernel.log
          $code = $LASTEXITCODE
          Get-Content launcher-kernel.log
          if ($code -ne 0) { exit $code }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: launcher-safety-windows
          path: |
            launcher-safety.log
            launcher-kernel.log
          if-no-files-found: error

  report:
    needs: [portable-regressions, windows-kernel-regressions]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          PORTABLE_RESULT: ${{ needs.portable-regressions.result }}
          WINDOWS_RESULT: ${{ needs.windows-kernel-regressions.result }}
        with:
          script: |
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const run = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {...repo, run_id: context.runId});
            const files = artifacts.map(a => `${a.name}: ${run}/artifacts/${a.id}`).join('\n');
            await github.rest.issues.createComment({...repo, issue_number: 1, body:
              `## Launcher safety regressions\n\nCommit: ${context.sha}\nRun: ${run}\nLinux: ${process.env.PORTABLE_RESULT}\nWindows: ${process.env.WINDOWS_RESULT}\n\n${files}\n\nScope: PID identity and launcher failure cleanup only. Not installer acceptance, full GUI acceptance, rollback, or PostgreSQL migration.`});
