name: Docly profile restore staging regressions
on:
  push:
    branches: [fix/docly-desktop-upgrade-safety]
    paths:
      - 'apps/api/app/profile_backup.py'
      - 'scripts/windows/profile_restore.py'
      - 'scripts/windows/test_profile_restore.py'
      - '.github/workflows/docly-profile-restore.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore-stage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    env:
      PYTHONPATH: apps/api
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Real backup and restore staging tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s apps/api/tests -p test_desktop_profile_backup.py -v 2>&1 | tee backup.log
          python -m unittest discover -s scripts/windows -p test_profile_restore.py -v 2>&1 | tee restore.log
      - name: Lint restore source and tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install ruff
          python -m ruff check scripts/windows/profile_restore.py scripts/windows/test_profile_restore.py 2>&1 | tee lint.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: profile-restore-${{ matrix.os }}
          path: |
            backup.log
            restore.log
            lint.log
          if-no-files-found: error
  report:
    needs: restore-stage
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          RESULT: ${{ needs.restore-stage.result }}
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id: context.runId});
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {...context.repo, run_id: context.runId});
            const statuses = jobs.map(j => `${j.name}: ${j.status}/${j.conclusion || 'pending'}; ${j.html_url}`).join('\n');
            const files = artifacts.map(a => `${a.name}: ${run}/artifacts/${a.id}`).join('\n');
            await github.rest.issues.createComment({...context.repo, issue_number: 1, body: `## Profile restore staging: ${process.env.RESULT}\nCommit: ${context.sha}\nRun: ${run}\n${statuses}\n${files}\n\nScope: real filesystem and SQLite WAL staging, checksums and failure cleanup. No live activation, program rollback, Inno integration or installer acceptance claimed.`});
            for (const job of jobs.filter(j => j.conclusion === 'failure')) {
              const response = await github.rest.actions.downloadJobLogsForWorkflowRun({...context.repo, job_id: job.id});
              const fetched = await fetch(response.url);
              if (!fetched.ok) throw new Error(`Job log download failed: ${fetched.status}`);
              const text = await fetched.text();
              await github.rest.issues.createComment({...context.repo, issue_number: 1, body: `## Restore failure diagnostics\nCommit: ${context.sha}\n${job.html_url}\n\n\`\`\`text\n${text.slice(-18000)}\n\`\`\``});
            }
  prior-failure-diagnostics:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            // Read the original diagnostic build, never replace its exact assertion.
            for (const run_id of [34052463158, 34053048156]) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id});
              for (const job of jobs.filter(j => j.conclusion === 'failure')) {
                const response = await github.rest.actions.downloadJobLogsForWorkflowRun({...context.repo, job_id: job.id});
                const fetched = await fetch(response.url);
                if (!fetched.ok) throw new Error(`Job log download failed: ${fetched.status}`);
                const text = await fetched.text();
                const lines = text.split('\n');
                const hit = lines.findIndex(line => line.includes('##[error]'));
                const excerpt = lines.slice(Math.max(0, hit - 100), hit + 30).join('\n').slice(-18000);
                await github.rest.issues.createComment({...context.repo, issue_number: 1, body: `## Original installer/restore failure diagnostics\n${job.html_url}\n\n\`\`\`text\n${excerpt}\n\`\`\`\nDiagnostic only; tests and exact shortcut assertions remain mandatory.`});
              }
            }
