name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm contracts:check
      - run: pnpm test:unit
      - name: Dependency audit (JS)
        run: pnpm audit --prod --audit-level=critical
        # Critical fails the job. High findings tracked in docs/ops/staging-go-no-go.md (B-09).

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bundled form font hash
        run: python -c "from app.services.forms.fill.fonts import assert_bundled_font; print(assert_bundled_font())"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ../../packages/py_dar
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check app tests ../../packages/py_dar/src
      - name: Mypy
        run: python -m mypy app
      - name: Unit + smoke (no infra)
        run: python -m pytest -q tests ../../tests/smoke/test_migrations.py ../../tests/smoke/test_health.py ../../packages/py_dar/tests
        env:
          APP_ENV: test
          ALLOW_FAKE_PROVIDERS: 'true'
          DATABASE_URL: postgresql+psycopg://dar_local:dar_local_password_change_me@localhost:5432/dar_local
          REDIS_URL: redis://localhost:6379/0
          SESSION_SECRET: test_session_secret_not_for_production_use
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY: dar_minio_access
          S3_SECRET_KEY: dar_minio_secret_change_me
          S3_BUCKET_ORIGINALS: dar-originals
          S3_BUCKET_DERIVED: dar-derived
          S3_BUCKET_REPORTS: dar-reports
          OBJECT_STORAGE_PROVIDER: fake_object_storage
          LEGAL_ROOT: ${{ github.workspace }}/legal
      - name: AI eval + privacy/restore drills (evidence)
        run: |
          python -m app.scripts.run_ai_eval
          python -m app.scripts.run_privacy_drill
          python -m app.scripts.run_restore_drill
        env:
          APP_ENV: test
          ALLOW_FAKE_PROVIDERS: 'true'
          DATABASE_URL: postgresql+psycopg://dar_local:dar_local_password_change_me@localhost:5432/dar_local
          REDIS_URL: redis://localhost:6379/0
          SESSION_SECRET: test_session_secret_not_for_production_use
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY: dar_minio_access
          S3_SECRET_KEY: dar_minio_secret_change_me
          S3_BUCKET_ORIGINALS: dar-originals
          S3_BUCKET_DERIVED: dar-derived
          S3_BUCKET_REPORTS: dar-reports
          OBJECT_STORAGE_PROVIDER: fake_object_storage
          LEGAL_ROOT: ${{ github.workspace }}/legal
      - name: Upload quality evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: |
            artifacts/ai-eval/
            artifacts/drills/
            artifacts/pixel-diff/
          if-no-files-found: warn
      - name: Legal package production gate must fail on drafts
        run: |
          python -c "from dar.legal_gate import validate_legal_package; import sys; r=validate_legal_package('../../legal', for_production=True); print(r.errors); sys.exit(0 if not r.ok else 1)"
        working-directory: apps/api
      - name: Upload pixel-diff artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: form-fill-pixel-diff
          path: artifacts/pixel-diff/
          if-no-files-found: warn

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dar_local
          POSTGRES_PASSWORD: dar_local_password_change_me
          POSTGRES_DB: dar_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dar_local -d dar_local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API
        working-directory: apps/api
        run: |
          python -m pip install -U pip
          python -m pip install -e ../../packages/py_dar
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
      - name: Upgrade / downgrade / upgrade
        working-directory: apps/api
        env:
          APP_ENV: test
          ALLOW_FAKE_PROVIDERS: 'true'
          DATABASE_URL: postgresql+psycopg://dar_local:dar_local_password_change_me@localhost:5432/dar_local
          REDIS_URL: redis://localhost:6379/0
          SESSION_SECRET: test_session_secret_not_for_production_use
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY: dar_minio_access
          S3_SECRET_KEY: dar_minio_secret_change_me
          S3_BUCKET_ORIGINALS: dar-originals
          S3_BUCKET_DERIVED: dar-derived
          S3_BUCKET_REPORTS: dar-reports
          OBJECT_STORAGE_PROVIDER: fake_object_storage
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Config scan — forbid prod fakes/defaults in prod compose
        run: |
          set -e
          if grep -E "ALLOW_FAKE_PROVIDERS:\\s*\\\"true\\\"|sqlite|change_me|fake_ocr|fake_llm|local_session_secret" infra/docker-compose.prod.yml; then
            echo "Forbidden markers in production compose"
            exit 1
          fi
          echo "prod compose config scan ok"
      - name: Trivy filesystem/config
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
