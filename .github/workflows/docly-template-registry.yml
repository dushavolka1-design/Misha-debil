name: Docly template candidate registry (NOT legal acceptance)

on:
  push:
    branches: [fix/docly-desktop-upgrade-safety]
    paths:
      - 'scripts/audit_template_inventory.py'
      - 'scripts/build_template_review_registry.py'
      - 'scripts/test_template_review_registry.py'
      - '.github/workflows/docly-template-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test archive integrity with real synthetic Git objects
        run: |
          set -euo pipefail
          mkdir -p artifacts/template-review
          python -m unittest discover -s scripts -p test_template_review_registry.py -v 2>&1 | tee artifacts/template-review/tests.log
      - name: Index fetched refs and archive verified candidate bytes
        run: |
          set -euo pipefail
          git for-each-ref --format='%(refname) %(objectname)' > artifacts/template-review/refs.txt
          python scripts/audit_template_inventory.py artifacts/template-review/inventory.json | tee artifacts/template-review/inventory-summary.log
          python scripts/build_template_review_registry.py artifacts/template-review/inventory.json artifacts/template-review/archive | tee artifacts/template-review/archive-summary.log
          sha256sum artifacts/template-review/archive/registry.json > artifacts/template-review/registry.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        id: evidence
        with:
          name: template-candidate-registry-and-original-blobs-NOT-ACCEPTED
          path: artifacts/template-review/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const file = 'artifacts/template-review/archive/registry.json';
            const registry = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : null;
            const summary = registry ? JSON.stringify({refs: registry.refs, records: registry.records.length, blobs: registry.unique_archived_blobs, bytes: registry.archive_bytes, externalObjects: registry.external_objects_not_inspected.length}, null, 2) : 'MISSING REGISTRY';
            await github.rest.issues.createComment({...context.repo, issue_number: 1, body: `## Template candidate archive: ${process.env.JOB_STATUS} — NOT legal/pixel acceptance\nCommit: ${context.sha}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nArtifact: ${process.env.EVIDENCE_URL || 'unavailable'}\n\`\`\`json\n${summary}\n\`\`\`\nScope: all fetched branch/tag tips, heuristic candidates, verified Git commit/path/blob and SHA-256 archive. Not all historical revisions. Every record remains UNVERIFIED; no official order/date/source or pixel score inferred. Draft / NO-GO.`});
