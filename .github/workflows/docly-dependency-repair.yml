name: Docly reviewed dependency repair
on:
  push:
    branches: [fix/docly-desktop-upgrade-safety]
    paths: ['.github/workflows/docly-dependency-repair.yml']
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: docly-reviewed-dependency-repair
  cancel-in-progress: false
jobs:
  dependencies:
    if: github.ref == 'refs/heads/fix/docly-desktop-upgrade-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: pnpm
      - name: Apply scoped patch versions from actual Trivy findings
        run: |
          set -euo pipefail
          mkdir -p artifacts/dependency-repair
          pnpm view postcss@8.5.18 version dist.integrity > artifacts/dependency-repair/postcss.txt
          pnpm view sharp@0.35.0 version dist.integrity > artifacts/dependency-repair/sharp.txt
          node <<'JS'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (p.pnpm) throw new Error('Review existing pnpm settings before changing overrides');
          p.pnpm = {overrides: {postcss: '8.5.18', sharp: '0.35.0'}};
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          JS
          pnpm install --lockfile-only 2>&1 | tee artifacts/dependency-repair/resolve.log
          pnpm install --frozen-lockfile 2>&1 | tee artifacts/dependency-repair/install.log
      - name: Actual package audit remains blocking
        run: |
          set -euo pipefail
          pnpm audit --prod --audit-level=high 2>&1 | tee artifacts/dependency-repair/audit.log
      - name: Preserve formatting, unit and real production build checks
        run: |
          set -euo pipefail
          pnpm format:check 2>&1 | tee artifacts/dependency-repair/format.log
          pnpm test:unit 2>&1 | tee artifacts/dependency-repair/unit.log
          pnpm --filter @dar/web build 2>&1 | tee artifacts/dependency-repair/build.log
      - name: Publish only reviewed manifest and generated lockfile
        run: |
          set -euo pipefail
          git add -- package.json pnpm-lock.yaml
          git diff --cached --check
          git diff --cached > artifacts/dependency-repair/reviewed.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deps): pin patched PostCSS 8.5.18 and Sharp 0.35.0'
          git push origin HEAD:fix/docly-desktop-upgrade-safety
          git rev-parse HEAD > artifacts/dependency-repair/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        id: evidence
        with:
          name: reviewed-dependency-repair
          path: artifacts/dependency-repair/
          if-no-files-found: error
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs'), dir = 'artifacts/dependency-repair/';
            const read = name => fs.existsSync(dir + name) ? fs.readFileSync(dir + name, 'utf8') : 'not produced';
            const logs = ['resolve.log', 'audit.log', 'format.log', 'unit.log', 'build.log'].map(name => `### ${name}\n\`\`\`text\n${read(name).slice(-6000)}\n\`\`\``).join('\n');
            await github.rest.issues.createComment({...context.repo, issue_number: 1, body: `## Reviewed dependency repair: ${process.env.JOB_STATUS}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nInput: ${context.sha}\nResult commit: ${read('commit.txt')}\nEvidence: ${process.env.EVIDENCE_URL || 'unavailable'}\n${logs}\n\nNo vulnerability suppressions or lowered severity gates. Full CI and Windows installer retest still required on the resulting source commit.`});
