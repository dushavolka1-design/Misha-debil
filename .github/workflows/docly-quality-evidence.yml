name: Docly quality evidence
on:
  push:
    branches: [fix/docly-desktop-upgrade-safety]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docly-quality-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Formatting, lint, regressions, production build and TypeScript
        run: |
          set -euo pipefail
          mkdir -p artifacts/quality-evidence
          pnpm format:check 2>&1 | tee artifacts/quality-evidence/format.log
          pnpm --filter @dar/web lint 2>&1 | tee artifacts/quality-evidence/lint.log
          pnpm test:unit 2>&1 | tee artifacts/quality-evidence/unit.log
          pnpm --filter @dar/web build 2>&1 | tee artifacts/quality-evidence/build.log
          pnpm --filter @dar/web typecheck 2>&1 | tee artifacts/quality-evidence/typecheck.log
          pnpm --filter @dar/web lint 2>&1 | tee artifacts/quality-evidence/post-build-lint.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        id: evidence
        with:
          name: web-quality-evidence
          path: artifacts/quality-evidence/
          if-no-files-found: error
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const logs = ['format', 'lint', 'unit', 'build', 'typecheck', 'post-build-lint'].map(name => {
              const path = `artifacts/quality-evidence/${name}.log`;
              const text = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(-6500) : 'NOT RUN';
              return `### ${name}\n\`\`\`text\n${text}\n\`\`\``;
            });
            await github.rest.issues.createComment({...context.repo, issue_number: 1, body: `## Web quality evidence: ${process.env.JOB_STATUS}\nCommit: ${context.sha}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nArtifact: ${process.env.EVIDENCE_URL || 'unavailable'}\n${logs.join('\n')}\nNot full application or installer acceptance. Existing CI remains required.`});
  python-typing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e packages/py_dar -r apps/api/requirements.txt -e 'apps/api[dev]'
      - name: Full strict API typing with complete diagnostics
        working-directory: apps/api
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/typing-evidence
          python -m mypy --version | tee ../../artifacts/typing-evidence/version.log
          python -m mypy app --no-pretty --no-color-output 2>&1 | tee ../../artifacts/typing-evidence/mypy.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        id: evidence
        with:
          name: complete-mypy-evidence
          path: artifacts/typing-evidence/
          if-no-files-found: error
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs'), path = 'artifacts/typing-evidence/mypy.log';
            const text = fs.existsSync(path) ? fs.readFileSync(path, 'utf8') : 'NOT RUN';
            const header = `## Complete strict typing evidence: ${process.env.JOB_STATUS}\nCommit: ${context.sha}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nArtifact: ${process.env.EVIDENCE_URL || 'unavailable'}\n`;
            const lines = text.split('\n');
            const chunks = [''];
            for (const line of lines) {
              if (chunks[chunks.length - 1].length + line.length > 18000) chunks.push('');
              chunks[chunks.length - 1] += line + '\n';
            }
            for (let i = 0; i < chunks.length; i++) {
              await github.rest.issues.createComment({...context.repo, issue_number: 1, body: header + `Part ${i + 1}/${chunks.length}\n\`\`\`text\n${chunks[i]}\n\`\`\`\nFailed typing remains a blocking failure; no suppressions or reduced scope.`});
            }
