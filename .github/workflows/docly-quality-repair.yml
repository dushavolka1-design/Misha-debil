name: Docly reviewed quality repair
on:
  push:
    branches: [fix/docly-desktop-upgrade-safety]
    paths: ['scripts/reviewed_quality_fixes.py', '.github/workflows/docly-quality-repair.yml']
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: docly-reviewed-quality-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/fix/docly-desktop-upgrade-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: apps/api:apps/worker
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e packages/py_dar -r apps/api/requirements.txt -e 'apps/api[dev]'
      - name: Before-repair safety and affected regressions
        run: |
          set -euo pipefail
          mkdir -p artifacts/quality-repair
          python -m pytest apps/api/tests/test_desktop*.py apps/api/tests/test_csrf_referer_origin.py apps/api/tests/test_ai_eval.py apps/api/tests/test_upload_lifecycle.py::test_fsm_blocks_process_before_clean -q --junitxml=artifacts/quality-repair/before.xml 2>&1 | tee artifacts/quality-repair/before.log
      - name: Apply only reviewed edits with independent AST validation
        run: python scripts/reviewed_quality_fixes.py
      - name: After-repair identical regression selection
        run: |
          set -euo pipefail
          python -m pytest apps/api/tests/test_desktop*.py apps/api/tests/test_csrf_referer_origin.py apps/api/tests/test_ai_eval.py apps/api/tests/test_upload_lifecycle.py::test_fsm_blocks_process_before_clean -q --junitxml=artifacts/quality-repair/after.xml 2>&1 | tee artifacts/quality-repair/after.log
          python -m unittest discover -s scripts/windows -p test_launcher_safety.py -v
          python -m unittest discover -s apps/worker/tests -p test_worker_shutdown.py -v
      - name: Complete existing Python lint scope remains blocking
        run: |
          set -euo pipefail
          python -m ruff check apps/api/app apps/api/tests packages/py_dar/src apps/worker/worker --output-format json > artifacts/quality-repair/ruff.json
      - name: Verify coverage and publish reviewed source commit
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess, xml.etree.ElementTree as ET
          from pathlib import Path
          def cases(name):
              rows = ET.parse(f'artifacts/quality-repair/{name}.xml').getroot().findall('.//testcase')
              assert rows and all(not any(r.find(x) is not None for x in ['failure', 'error', 'skipped']) for r in rows)
              return sorted((r.get('classname'), r.get('name')) for r in rows)
          assert cases('before') == cases('after'), 'Regression selection changed'
          paths = json.loads(Path('artifacts/quality-repair/changed-files.json').read_text())
          assert paths, 'No source repairs produced'
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          git diff --cached --check
          git diff --cached > artifacts/quality-repair/reviewed.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(python): resolve reviewed lint findings without weakening checks'
          git push origin HEAD:fix/docly-desktop-upgrade-safety
          git rev-parse HEAD > artifacts/quality-repair/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        id: evidence
        with:
          name: reviewed-quality-repair
          path: artifacts/quality-repair/
          if-no-files-found: error
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const dir = 'artifacts/quality-repair/';
            const read = name => fs.existsSync(dir + name) ? fs.readFileSync(dir + name, 'utf8') : 'not produced';
            const body = `## Reviewed quality repair: ${process.env.JOB_STATUS}\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nInput: ${context.sha}\nSource commit: ${read('commit.txt')}\nEvidence: ${process.env.EVIDENCE_URL || 'unavailable'}\n\nBefore:\n\`\`\`text\n${read('before.log').slice(-3500)}\n\`\`\`\nAfter:\n\`\`\`text\n${read('after.log').slice(-3500)}\n\`\`\`\nRuff:\n\`\`\`json\n${read('ruff.json').slice(-12000)}\n\`\`\`\nScope: reviewed Python repairs only. Bot source commit needs a new full CI run; not installer, PostgreSQL migration, official form or release acceptance.`;
            await github.rest.issues.createComment({...context.repo, issue_number: 1, body});
