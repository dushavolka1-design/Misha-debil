name: Docly CI diagnostics
on:
  push:
    branches: [fix/docly-desktop-upgrade-safety]
    paths:
      - '.github/workflows/docly-ci-diagnostics.yml'
      - 'scripts/audit_template_inventory.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Refresh all branch and tag refs without pruning
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
      - name: Inventory all tracked files and template candidates
        run: python scripts/audit_template_inventory.py
      - name: Preserve complete inventory
        id: inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: all-branch-template-inventory
          path: artifacts/template-audit/inventory.json
          if-no-files-found: error
      - name: Collect actual checks, artifacts and failed job logs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        if: always()
        env:
          INVENTORY_URL: ${{ steps.inventory.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const dir = 'artifacts/ci-diagnostics';
            fs.mkdirSync(dir, {recursive: true});
            const sections = [`Audit commit: ${context.sha}`, `Run: ${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`, `Inventory: ${process.env.INVENTORY_URL || 'unavailable'}`];
            if (fs.existsSync('artifacts/template-audit/inventory.json')) {
              const data = JSON.parse(fs.readFileSync('artifacts/template-audit/inventory.json', 'utf8'));
              sections.push('Branch/tag refs: ' + JSON.stringify(data.refs));
              sections.push('Indexed file entries: ' + data.files.length + '. Candidates are not verified official forms.');
            }
            const records = [];
            const workflows = ['docly-python-runtime.yml', 'docly-quality-evidence.yml', 'ci.yml', 'docly-desktop-verification.yml', 'docly-launcher-safety.yml', 'docly-worker-regressions.yml', 'docly-security-regressions.yml', 'docly-quality-repair.yml', 'docly-profile-backup.yml'];
            for (const workflow_id of workflows) {
              const runs = await github.rest.actions.listWorkflowRuns({...repo, workflow_id, branch: 'fix/docly-desktop-upgrade-safety', per_page: 2});
              for (const run of runs.data.workflow_runs) {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...repo, run_id: run.id, per_page: 100});
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {...repo, run_id: run.id, per_page: 100});
                records.push({workflow_id, run, jobs, artifacts});
                sections.push(`\n${workflow_id}: ${run.status}/${run.conclusion || 'pending'}, commit ${run.head_sha}, ${run.html_url}`);
                for (const artifact of artifacts) sections.push(`Artifact ${artifact.name}: ${run.html_url}/artifacts/${artifact.id}`);
                for (const job of jobs) {
                  sections.push(`- ${job.name}: ${job.status}/${job.conclusion || 'pending'}; ${job.html_url}`);
                  if (workflow_id === 'docly-python-runtime.yml') {
                    for (const step of job.steps || []) sections.push(`  Step ${step.number} ${step.name}: ${step.status}/${step.conclusion || 'pending'}`);
                  }
                  if (!['failure', 'timed_out', 'cancelled'].includes(job.conclusion)) continue;
                  try {
                    const result = await github.rest.actions.downloadJobLogsForWorkflowRun({...repo, job_id: job.id});
                    const text = typeof result.data === 'string' ? result.data : Buffer.from(result.data).toString('utf8');
                    fs.writeFileSync(`${dir}/${run.id}-${job.id}.log`, text);
                    const lines = text.split('\n');
                    const index = lines.findIndex(line => line.includes('##[error]'));
                    const excerpt = (index >= 0 ? lines.slice(Math.max(0, index - 100), index + 8).join('\n') : text.slice(-9000)).slice(-12000);
                    sections.push(`\n\`\`\`text\n${excerpt}\n\`\`\`\n`);
                  } catch (error) {
                    sections.push(`Log retrieval failed: ${error.message}`);
                  }
                }
              }
            }
            fs.writeFileSync(`${dir}/runs.json`, JSON.stringify(records, null, 2));
            const report = sections.join('\n');
            fs.writeFileSync(`${dir}/report.md`, report);
            await github.rest.issues.createComment({...repo, issue_number: 1, body: ('## Current checks and artifacts (not a release approval)\n\n' + report).slice(0, 59000) + '\n\nFull metadata/report and available failed logs are retained in the ci-diagnostics artifact of this audit run. In-progress, skipped and cancelled checks are not successful acceptance.'});
      - name: Preserve complete diagnostics rather than only comment excerpts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-diagnostics
          path: artifacts/ci-diagnostics/
          if-no-files-found: error
