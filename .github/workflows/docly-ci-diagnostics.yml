name: Docly CI diagnostics
on:
  push:
    branches: [fix/docly-desktop-upgrade-safety]
    paths:
      - '.github/workflows/docly-ci-diagnostics.yml'
      - 'scripts/audit_template_inventory.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Refresh all branch and tag refs without pruning
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags
      - name: Inventory all tracked files and template candidates
        run: python scripts/audit_template_inventory.py
      - name: Preserve complete inventory
        id: inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: all-branch-template-inventory
          path: artifacts/template-audit/inventory.json
          if-no-files-found: error
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        if: always()
        env:
          INVENTORY_URL: ${{ steps.inventory.outputs.artifact-url }}
        with:
          script: |
            const fs = require('fs');
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const sections = [`Audit run: ${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`, `Inventory artifact: ${process.env.INVENTORY_URL || 'unavailable'}`];
            if (fs.existsSync('artifacts/template-audit/inventory.json')) {
              const data = JSON.parse(fs.readFileSync('artifacts/template-audit/inventory.json', 'utf8'));
              sections.push('Branch/tag refs: ' + JSON.stringify(data.refs));
              sections.push('Complete file index entries: ' + data.files.length);
              const paths = [...new Set(data.files.filter(x => x.candidate && /forms|template|worksheet|fixture|pixel/i.test(x.path)).map(x => x.path))];
              sections.push('Candidate paths (not verified official forms):\n' + paths.join('\n'));
            }
            for (const workflow_id of ['docly-desktop-verification.yml', 'ci.yml', 'docly-launcher-safety.yml']) {
              const runs = await github.rest.actions.listWorkflowRuns({...repo, workflow_id, branch: 'fix/docly-desktop-upgrade-safety', per_page: 3});
              for (const run of runs.data.workflow_runs) {
                sections.push(`\n${workflow_id}: ${run.status}/${run.conclusion || 'pending'}, commit ${run.head_sha}, ${run.html_url}`);
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...repo, run_id: run.id, per_page: 100});
                for (const job of jobs) {
                  sections.push(`- ${job.name}: ${job.status}/${job.conclusion || 'pending'}; ${job.html_url}`);
                  if (job.conclusion !== 'failure') continue;
                  try {
                    const result = await github.rest.actions.downloadJobLogsForWorkflowRun({...repo, job_id: job.id});
                    const text = typeof result.data === 'string' ? result.data : Buffer.from(result.data).toString('utf8');
                    const lines = text.split('\n');
                    const index = lines.findIndex(line => line.includes('##[error]'));
                    const excerpt = (index >= 0 ? lines.slice(Math.max(0, index - 45), index + 8).join('\n') : text.slice(-5000)).slice(-6000);
                    sections.push(`\n\`\`\`text\n${excerpt}\n\`\`\`\n`);
                  } catch (error) {
                    sections.push(`Log retrieval failed: ${error.message}`);
                  }
                }
              }
            }
            await github.rest.issues.createComment({...repo, issue_number: 1, body: ('## Current CI and template inventory diagnostics\n\n' + sections.join('\n')).slice(0, 60000)});
