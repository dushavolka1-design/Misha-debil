[project]
name = "dar-api"
version = "0.1.0"
description = "Document Analyzer RF API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "redis>=5.2",
  "boto3>=1.36",
  "python-multipart>=0.0.20",
  "httpx>=0.28",
  "pydantic-settings>=2.7",
  "argon2-cffi>=23.1",
  "email-validator>=2.2",
  "cryptography>=42.0",
  "pypdf>=5.0",
  "Pillow>=10.0",
  "pypdfium2>=4.0",
  "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.9",
  "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "../../tests/smoke"]
pythonpath = [".", "../../packages/py_dar/src"]
